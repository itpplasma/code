#cloud-config
package_update: true
packages:
  - ca-certificates
  - git

write_files:
  - path: /usr/local/sbin/setup-itp-ai
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      target_user="$(awk -F: '$3 >= 1000 && $3 < 60000 && $7 !~ /(nologin|false)$/ {print $1; exit}' /etc/passwd)"
      if [[ -z "${target_user}" ]]; then
          echo "No interactive user found" >&2
          exit 1
      fi
      install_root=/opt/itpplasma-code
      if [[ -d "${install_root}/.git" ]]; then
          git -C "${install_root}" pull --ff-only
      else
          git clone --depth 1 https://github.com/itpplasma/code.git "${install_root}"
      fi
      "${install_root}/scripts/setup/apt.sh" ai --user "${target_user}" --no-upgrade
      ln -sf "${install_root}/scripts/setup/ai-private-tools.sh" /usr/local/bin/ai-private-tools
      ln -sf "${install_root}/scripts/setup/ai-tools.sh" /usr/local/bin/ai-update
      ln -sf "${install_root}/scripts/setup/ai-user-config.sh" /usr/local/bin/ai-user-config
      printf '%s\n' "Provisioned from $(git -C "${install_root}" rev-parse HEAD)" > /etc/ai-infra-release

runcmd:
  - [bash, /usr/local/sbin/setup-itp-ai]

final_message: "AI coding VM provisioning completed after $UPTIME seconds"

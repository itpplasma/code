# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  GIT_HTTPS: "true"
  CI_MERGE_REQUEST_SOURCE_BRANCH_NAME: "${{ github.head_ref }}"

jobs:
  code:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y -q --no-install-recommends \
            apt-transport-https \
            build-essential \
            ca-certificates \
            curl \
            libssl-dev \
            openssh-client \
            rsync \
            wget \
            git \
            gfortran \
            ninja-build \
            cmake \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv

          sudo apt-get install -y -q --no-install-recommends \
            python3-tk \
            idle3 \
            findent \
            expect \
            environment-modules

          sudo apt-get install -y -q --no-install-recommends \
            pkg-config \
            libsuitesparse-dev \
            libopenblas-dev \
            libsuperlu-dev \
            libhdf5-dev \
            libhdf5-openmpi-dev \
            libnetcdf-dev \
            libnetcdff-dev \
            libfftw3-dev \
            libgsl-dev \
            libopenmpi-dev \
            libscalapack-openmpi-dev \
            libpcre3-dev \
            libreadline-dev \
            h5utils \
            hdf5-tools \
            netcdf-bin \
            libmetis-dev \
            libboost-all-dev

      - name: Checkout infra sources
        uses: actions/checkout@v4
        with:
          path: infra-src

      - name: Download Release  # TODO: make this dynamic
        run: |
          wget https://github.com/itpplasma/code/releases/download/v2025.01.02/code-v2025.01.02.tar.gz -O /tmp/code.tar.gz

      - name: Assemble infra
        run: |
          # The release tarball carries the prebuilt deps (.venv, external) but
          # its scripts are frozen at release time. Overlay the current checkout
          # so activation and setup scripts match this branch.
          mkdir -p infra
          tar -xzf /tmp/code.tar.gz -C infra
          rsync -a --exclude='.git' --exclude='.venv' --exclude='external' infra-src/ infra/
          # The release .venv was built at a different path; relocate its
          # console-script shebangs to where it now lives.
          NEWV="$PWD/infra/.venv"
          OLDV=$(sed -n '1s|^#!\(.*\)/bin/python.*|\1|p' infra/.venv/bin/f2py 2>/dev/null || true)
          if [ -n "$OLDV" ] && [ "$OLDV" != "$NEWV" ]; then
            grep -rIl "$OLDV" infra/.venv/bin | xargs -r sed -i "s|$OLDV|$NEWV|g"
          fi

      - name: NEO-2
        run: |
          set +e; source infra/activate.sh; set -e
          clone_github NEO-2
          cd NEO-2
          $INFRA/scripts/checkout_branch.sh $CODE_BRANCH
          make

      - name: NEO-RT
        run: |
          set +e; source infra/activate.sh; set -e
          clone_github NEO-RT
          cd NEO-RT
          $INFRA/scripts/checkout_branch.sh $CODE_BRANCH
          make

      - name: SIMPLE
        run: |
          set +e; source infra/activate.sh; set -e
          clone_github SIMPLE
          cd SIMPLE
          $INFRA/scripts/checkout_branch.sh $CODE_BRANCH
          make


      - name: GORILLA
        run: |
          set +e; source infra/activate.sh; set -e
          clone_github GORILLA
          cd GORILLA
          $INFRA/scripts/checkout_branch.sh $CODE_BRANCH
          make

      - name: MEPHIT
        run: |
          set +e; source infra/activate.sh; set -e
          clone_github MEPHIT
          source /etc/profile.d/modules.sh
          module use -a $INFRA/modules
          module load mephit
          cd MEPHIT
          $INFRA/scripts/checkout_branch.sh $CODE_BRANCH
          make
          pip install -e .

name: Mirror Repository

on:
  push:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  push-to-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Push to remote mirror
        env:
          GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_ACCESS_TOKEN}@gitlab.tugraz.at/plasma/code.git"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git push gitlab "$CURRENT_BRANCH"
    # Mirroring publishes the merged default branch, so it must also run for
    # pushes made by the merge queue (the usual way main advances).
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
